<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse Browser V.2.1.2 - Homepage</title>
    <link rel="icon" type="image/x-icon" href="https://7-7-7-15.github.io/assets/logo/logo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #2d2d2d 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Header */
        .header {
            padding: 20px 40px;
            background: rgba(17, 17, 17, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #4a90e2, #357abd);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }
        
        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4a90e2, #357abd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header-actions {
            display: flex;
            gap: 15px;
        }
        
        .header-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #333, #444);
            border: 1px solid #555;
            border-radius: 8px;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .header-btn:hover {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            border-color: #4a90e2;
            transform: translateY(-2px);
        }
        
        /* Main Dashboard */
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .welcome {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .welcome h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4a90e2, #357abd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .welcome p {
            font-size: 1.2rem;
            color: #888;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* Search Bar */
        .search-container {
            background: rgba(17, 17, 17, 0.9);
            backdrop-filter: blur(20px);
            border: 2px solid #333;
            border-radius: 20px;
            padding: 5px;
            margin: 40px auto;
            max-width: 600px;
            display: flex;
        }
        
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 20px;
            font-size: 1.1rem;
            color: #e0e0e0;
            outline: none;
        }
        
        .search-btn {
            background: linear-gradient(135deg, #4a90e2, #357abd);
            border: none;
            padding: 20px;
            border-radius: 16px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .search-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(74, 144, 226, 0.4);
        }
        
        /* Quick Access Grid */
        .quick-access {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        
        .quick-item {
            background: rgba(37, 37, 37, 0.7);
            border: 1px solid #444;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .quick-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(74, 144, 226, 0.1), transparent);
            transition: left 0.5s;
        }
        
        .quick-item:hover::before {
            left: 100%;
        }
        
        .quick-item:hover {
            background: rgba(74, 144, 226, 0.1);
            border-color: #4a90e2;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(74, 144, 226, 0.2);
        }
        
        .quick-icon {
            font-size: 2.5rem;
            color: #4a90e2;
            margin-bottom: 10px;
        }
        
        .quick-title {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        /* UV Content Area */
        .uv-content {
            margin-top: 40px;
            padding: 20px;
            background: rgba(17, 17, 17, 0.8);
            border-radius: 16px;
            border: 1px solid #333;
        }
        
        .uv-content h2 {
            color: #4a90e2;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        /* Sidebar (same as before but simplified) */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 300px;
            height: 100vh;
            background: rgba(17, 17, 17, 0.95);
            border-right: 1px solid #333;
            padding: 20px;
            overflow-y: auto;
            z-index: 1000;
        }
        
        .main-content {
            margin-left: 300px;
            padding: 20px;
        }
        
        .tab-item {
            background: rgba(37, 37, 37, 0.7);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }
        
        .tab-item:hover,
        .tab-item.active {
            background: rgba(74, 144, 226, 0.2);
            border-left-color: #4a90e2;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 100%; transform: translateX(-100%); }
            .main-content { margin-left: 0; }
            .header { padding: 15px 20px; }
        }
    </style>
</head>
<body>
    <!-- Sidebar (Vertical Tabs) -->
    <div class="sidebar">
        <div style="margin-bottom: 30px;">
            <h3 style="color: #4a90e2; margin-bottom: 15px;">Tabs</h3>
            <div class="tab-item active">
                <i class="fas fa-home" style="margin-right: 10px;"></i>
                Homepage
                <button style="float: right; background: none; border: none; color: #666; cursor: pointer;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        
        <button style="width: 100%; padding: 12px; background: linear-gradient(135deg, #4a90e2, #357abd); border: none; border-radius: 8px; color: white; cursor: pointer;">
            <i class="fas fa-plus" style="margin-right: 8px;"></i>New Tab
        </button>
    </div>
    
    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-eclipse"></i></div>
                <div class="logo-text">Eclipse V.2.1.2</div>
            </div>
            <div class="header-actions">
                <button class="header-btn">Settings</button>
                <button class="header-btn">Help</button>
            </div>
        </div>
        
        <!-- Dashboard -->
        <div class="dashboard">
            <!-- Welcome -->
            <div class="welcome">
                <h1>Welcome to Eclipse</h1>
                <p>Your ultimate streaming browser experience</p>
            </div>
            
            <!-- Search -->
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Search the web or enter URL..." />
                <button class="search-btn"><i class="fas fa-search"></i></button>
            </div>
            
            <!-- Quick Access -->
            <div class="quick-access">
                <div class="quick-item">
                    <div class="quick-icon"><i class="fab fa-netflix"></i></div>
                    <div class="quick-title">Netflix</div>
                </div>
                <div class="quick-item">
                    <div class="quick-icon"><i class="fab fa-youtube"></i></div>
                    <div class="quick-title">YouTube</div>
                </div>
                <div class="quick-item">
                    <div class="quick-icon"><i class="fas fa-film"></i></div>
                    <div class="quick-title">Movies</div>
                </div>
                <div class="quick-item">
                    <div class="quick-icon"><i class="fas fa-tv"></i></div>
                    <div class="quick-title">TV Shows</div>
                </div>
            </div>
            
            <!-- UV Content Area -->
            <div class="uv-content">
                <h2>Featured Content</h2>
                <!-- UV scripts load here -->
                <div id="uv-player"></div>
            </div>
        </div>
    </div>

    <!-- UV Scripts -->
    <script src="uv/uv.bundle.js" defer></script>
    <script src="uv/uv.config.js" defer></script>
    
    <script>
        // Simple homepage functionality
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.querySelector('.search-input');
            const searchBtn = document.querySelector('.search-btn');
            
            searchBtn.addEventListener('click', () => {
                const query = searchInput.value.trim();
                if (query) {
                    if (query.startsWith('http')) {
                        window.open(query, '_blank');
                    } else {
                        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
                    }
                }
            });
            
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchBtn.click();
            });
            
            // Quick access clicks
            document.querySelectorAll('.quick-item').forEach(item => {
                item.addEventListener('click', () => {
                    const title = item.querySelector('.quick-title').textContent;
                    if (title === 'Netflix') window.open('https://netflix.com', '_blank');
                    if (title === 'YouTube') window.open('https://youtube.com', '_blank');
                });
            });
        });
    </script>
</body>
</html>
